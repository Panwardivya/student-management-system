
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <!-- Main Heading -->
    <header>
        <h1>Student Management System</h1>
        <p>Student Registration Form</p>
    </header>


    <!-- Main Form Section -->
    <main>

        <form id="studentForm">

            <!-- Student Information -->
            <section>

                <h2>Student Information</h2>

                <!-- Student ID -->
                <label for="studentId">Student ID:</label>
                <input type="text" id="studentId" name="studentId" placeholder="Enter Student ID" required>


                 

                <!-- Full Name -->
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter Full Name" required>


                <!-- Age -->
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" placeholder="Enter Age" min="1" max="100" required>


                <!-- Gender -->
                <label>Gender:</label>

                <input type="radio" id="male" name="gender" value="Male" required>
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="Other">
                <label for="other">Other</label>


                <!-- Date of Birth -->
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>

            </section>


            <!-- Contact Information -->
            <section>

                <h2>Contact Information</h2>

                <!-- Email -->
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>


                <!-- Phone -->
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter Phone Number" required>


                <!-- Address -->
                <label for="address">Address:</label>
                <textarea id="address" name="address" rows="4" placeholder="Enter Full Address"></textarea>


                <!-- City -->
                <label for="city">City:</label>
                <input type="text" id="city" name="city" placeholder="Enter City">


                <!-- State -->
                <label for="state">State:</label>

<select id="state" name="state" required>

    <option value="">Select State</option>

    <option value="Andhra Pradesh">Andhra Pradesh</option>
    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
    <option value="Assam">Assam</option>
    <option value="Bihar">Bihar</option>
    <option value="Chhattisgarh">Chhattisgarh</option>
    <option value="Goa">Goa</option>
    <option value="Gujarat">Gujarat</option>
    <option value="Haryana">Haryana</option>
    <option value="Himachal Pradesh">Himachal Pradesh</option>
    <option value="Jharkhand">Jharkhand</option>
    <option value="Karnataka">Karnataka</option>
    <option value="Kerala">Kerala</option>
    <option value="Madhya Pradesh">Madhya Pradesh</option>
    <option value="Maharashtra">Maharashtra</option>
    <option value="Manipur">Manipur</option>
    <option value="Meghalaya">Meghalaya</option>
    <option value="Mizoram">Mizoram</option>
    <option value="Nagaland">Nagaland</option>
    <option value="Odisha">Odisha</option>
    <option value="Punjab">Punjab</option>
    <option value="Rajasthan">Rajasthan</option>
    <option value="Sikkim">Sikkim</option>
    <option value="Tamil Nadu">Tamil Nadu</option>
    <option value="Telangana">Telangana</option>
    <option value="Tripura">Tripura</option>
    <option value="Uttar Pradesh">Uttar Pradesh</option>
    <option value="Uttarakhand">Uttarakhand</option>
    <option value="West Bengal">West Bengal</option>

</select>
            </section>


            <!-- Academic Information -->
            <section>

                <h2>Academic Information</h2>

                <!-- Course -->
                <label for="course">Course:</label>

                <select id="course" name="course" required>

                    <option value="">Select Course</option>

                    <option value="B.Tech CSE">
                        B.Tech Computer Science Engineering
                    </option>

                    <option value="B.Tech Data Science">
                        B.Tech Data Science
                    </option>

                    <option value="BCA">
                        Bachelor of Computer Applications
                    </option>

                    <option value="MCA">
                        Master of Computer Applications
                    </option>

                    <option value="BBA">
                        Bachelor of Business Administration
                    </option>

                </select>


                <!-- Semester -->
                <label for="semester">Semester:</label>

                <select id="semester" name="semester" required>

                    <option value="">Select Semester</option>

                    <option value="1">1st Semester</option>
                    <option value="2">2nd Semester</option>
                    <option value="3">3rd Semester</option>
                    <option value="4">4th Semester</option>
                    <option value="5">5th Semester</option>
                    <option value="6">6th Semester</option>
                    <option value="7">7th Semester</option>
                    <option value="8">8th Semester</option>

                </select>


                <!-- Enrollment Date -->
                <label for="enrollmentDate">
                    Enrollment Date:
                </label>

                <input type="date" id="enrollmentDate" name="enrollmentDate" required>


                <!-- Previous Qualification -->
                <label for="qualification">
                    Previous Qualification:
                </label>

                <input type="text" id="qualification" name="qualification" placeholder="e.g. 12th / Diploma">


                <!-- Percentage -->
                <label for="percentage">
                    Previous Qualification Percentage:
                </label>

                <input type="number" id="percentage" name="percentage" placeholder="Enter Percentage" min="0" max="100"
                    step="0.01">

            </section>


            <!-- Buttons -->
            <section>

                <button type="submit">
                    Add Student
                </button>

                <button type="reset">
                    Reset
                </button>

            </section>

        </form>


    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
